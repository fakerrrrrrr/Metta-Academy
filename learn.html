<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<meta name="page-title" content="title_learn">
<title>ห้องเรียน · Metta Tattoo Academy</title>
<link rel="icon" href="images/logo-cat.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/academy.css">
</head>
<body>
<div class="amb"></div>
<header class="nav" id="nav"></header>
<main class="app">
  <div class="wrap">
    <section class="cl-hero" id="hero">
      <div class="cl-hero-bg" aria-hidden="true"></div>
      <div class="cl-hero-main">
        <div class="eyebrow" data-i18n="learn_eyebrow"></div>
        <h1 id="hello"></h1>
        <p class="cl-tag" data-i18n="cl_tagline"></p>
        <div class="cl-plan" id="planLine"></div>
        <div class="cl-acts" id="heroActs"></div>
      </div>
      <div class="cl-ring" id="ring"></div>
    </section>
    <div class="cl-stats" id="status"></div>
    <div id="exam"></div>
    <div id="alerts"></div>
    <section class="journey-wrap" id="journeyWrap">
      <div class="journey-h"><div><h2 data-i18n="cl_journey"></h2><p data-i18n="cl_journey_p"></p></div></div>
      <div class="journey" id="journey"></div>
    </section>
    <div class="classroom">
      <div class="player-col">
        <div class="player" id="player"></div>
        <div class="lesson-info" id="lessonInfo"></div>
        <div class="protect-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg><span data-i18n="protect_note"></span></div>
      </div>
      <aside class="lessons" id="lessons" aria-label="Lessons"></aside>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/access.js"></script>
<script src="assets/js/course-data.js"></script>
<script src="assets/js/kits-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/learn.js"></script>
</body>
</html>
